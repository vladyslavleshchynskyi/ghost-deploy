AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ghost blog on a single EC2 instance with zero inbound ports.
  Admin access via SSM Session Manager, public traffic via Tailscale Funnel.
  Deploy with deploy.sh (it embeds bootstrap.sh into UserData).

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
  TsHostname:
    Type: String
    Default: ghost
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,62}$"
  AdminEmail:
    Type: String
    AllowedPattern: "^[^@\\s'\"]+@[^@\\s'\"]+\\.[^@\\s'\"]+$"
  BlogTitle:
    Type: String
    Default: My Ghost Blog
    AllowedPattern: "^[A-Za-z0-9 .,!?-]{1,60}$"

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public IP is used for outbound traffic only (SSM, Tailscale, image pulls);
  # the security group below has no inbound rules at all.
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound rules - admin via SSM, public traffic via Tailscale Funnel
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: stack-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          # Hop limit 1 keeps IMDS (and the instance role) out of reach of containers.
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref VolumeSize
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Join:
              - ""
              - - !Sub |
                  #!/bin/bash
                  STACK_NAME='${AWS::StackName}'
                  AWS_REGION='${AWS::Region}'
                  TS_HOSTNAME='${TsHostname}'
                  ADMIN_EMAIL='${AdminEmail}'
                  BLOG_TITLE='${BlogTitle}'
                - |
                  __BOOTSTRAP__

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [DefaultRoute, SubnetRouteTableAssociation]
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

Outputs:
  InstanceId:
    Value: !Ref Instance
  SecurityGroupId:
    Value: !Ref SecurityGroup
  ParameterPrefix:
    Value: !Sub /${AWS::StackName}
